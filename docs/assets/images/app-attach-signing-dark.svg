<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 25 1000 442" width="1000" height="442" font-family="'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sign once, trust everywhere</title><desc id="d">One code signing certificate signs every MSIX package, with a timestamp. One Intune trusted certificate profile pushes the root and intermediate certificates to AVD session hosts and Windows 365 Cloud PCs. A public CA certificate needs no profile, and App-V packages need no certificate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4aa3f0"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b93b2"/></marker></defs><rect x="30" y="60" width="280" height="270" rx="12" fill="#161f2c" stroke="#2c3a4c" stroke-width="1.2"/><text x="46" y="84" font-size="12.5" font-weight="700" fill="#7dbbf3" text-anchor="start">1. Get a certificate, once</text><rect x="48" y="100" width="244" height="100" rx="8" fill="#1b2636" stroke="#33465c" stroke-width="1.2"/><svg x="62" y="117" width="34" height="34" viewBox="0 0 18 18"><defs><radialGradient id="i1-fb114c93-7c16-4540-899a-0796041629e6" cx="9" cy="9" r="8.5" gradientUnits="userSpaceOnUse"><stop offset="0.18" stop-color="#5ea0ef" /><stop offset="0.56" stop-color="#5c9fee" /><stop offset="0.69" stop-color="#559ced" /><stop offset="0.78" stop-color="#4a97e9" /><stop offset="0.86" stop-color="#3990e4" /><stop offset="0.93" stop-color="#2387de" /><stop offset="0.99" stop-color="#087bd6" /><stop offset="1" stop-color="#0078d4" /></radialGradient><radialGradient id="i1-ec478bd3-5b38-4e7f-b661-11f355578bff" cx="38.95" cy="182.07" r="9.88" gradientTransform="translate(-28.71 -163.24) scale(0.94 0.94)" gradientUnits="userSpaceOnUse"><stop offset="0.27" stop-color="#ffd70f" /><stop offset="0.49" stop-color="#ffcb12" /><stop offset="0.88" stop-color="#feac19" /><stop offset="1" stop-color="#fea11b" /></radialGradient></defs><title>Icon-security-245</title><path id="i1-aacf8311-a317-400f-b613-74bd00da5ce3" d="M9,.5A8.5,8.5,0,1,0,17.5,9,8.51,8.51,0,0,0,9,.5ZM9,16.34A7.34,7.34,0,1,1,16.34,9,7.34,7.34,0,0,1,9,16.34Z" fill="url(#i1-fb114c93-7c16-4540-899a-0796041629e6)" /><circle cx="9" cy="9" r="7.34" fill="#fff" /><g><path id="i1-bd983c41-db73-40ec-a4f4-da1213fc9924" d="M13.44,7.33a1.84,1.84,0,0,0,0-2.59h0L10.29,1.58a1.83,1.83,0,0,0-2.58,0h0L4.56,4.74a1.84,1.84,0,0,0,0,2.59L7.18,10a.51.51,0,0,1,.15.36v4.88a.63.63,0,0,0,.18.44l1.2,1.2a.41.41,0,0,0,.58,0l1.16-1.16h0l.68-.68a.25.25,0,0,0,0-.34l-.49-.49a.27.27,0,0,1,0-.37l.49-.49a.25.25,0,0,0,0-.34l-.49-.49a.27.27,0,0,1,0-.37l.49-.49a.25.25,0,0,0,0-.34l-.68-.69v-.25ZM9,2.35A1,1,0,0,1,9,4.42,1,1,0,1,1,9,2.35Z" fill="url(#i1-ec478bd3-5b38-4e7f-b661-11f355578bff)" /><path id="i1-ad2e7e44-9bfd-4775-8bf4-8ef26a544921" d="M8.18,15.3h0a.23.23,0,0,0,.38-.17v-4a.24.24,0,0,0-.11-.2h0a.22.22,0,0,0-.34.2v4A.28.28,0,0,0,8.18,15.3Z" fill="#ff9300" opacity="0.75" /><rect id="i1-a996fbff-3936-4b24-b407-369336c143ba" x="6.48" y="5.79" width="5.17" height="0.61" rx="0.28" fill="#ff9300" opacity="0.75" /><rect id="i1-bb12d31c-3352-4a18-87dd-a169a4a8721d" x="6.48" y="6.78" width="5.17" height="0.61" rx="0.28" fill="#ff9300" opacity="0.75" /></g></svg><text x="108" y="131.0" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">Code signing certificate</text><text x="108" y="154.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">From your internal CA, or</text><text x="108" y="169.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">bought from a public CA</text><rect x="48" y="226" width="244" height="86" rx="8" fill="#1b2636" stroke="#33465c" stroke-width="1.2"/><svg x="62" y="243" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i2-a7cb4d9d-9f89-4e53-8eda-938427310066" x1="8.8" y1="12.87" x2="8.8" y2="0.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i2-eab4c6b4-621d-4d9b-b611-15ceb58765b1" x1="8.81" y1="17.5" x2="8.81" y2="12.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1490df" /><stop offset="0.98" stop-color="#1f56a3" /></linearGradient></defs><title>Icon-compute-33</title><rect x="-0.2" y="0.87" width="18" height="12" rx="0.6" fill="url(#i2-a7cb4d9d-9f89-4e53-8eda-938427310066)" /><polygon points="11.8 5.12 11.8 8.61 8.8 10.37 8.8 6.87 11.8 5.12" fill="#50e6ff" /><polygon points="11.8 5.12 8.81 6.88 5.8 5.12 8.81 3.37 11.8 5.12" fill="#c3f1ff" /><polygon points="8.8 6.88 8.8 10.37 5.8 8.61 5.8 5.12 8.8 6.88" fill="#9cebff" /><polygon points="5.8 8.61 8.8 6.87 8.8 10.37 5.8 8.61" fill="#c3f1ff" /><polygon points="11.8 8.61 8.8 6.87 8.8 10.37 11.8 8.61" fill="#9cebff" /><path d="M12.41,16.5c-1.78-.28-1.85-1.56-1.84-3.63H7C7,14.94,7,16.22,5.19,16.5a1,1,0,0,0-.88,1h9A1.06,1.06,0,0,0,12.41,16.5Z" fill="url(#i2-eab4c6b4-621d-4d9b-b611-15ceb58765b1)" /><path d="M4.68,2.07H1.93a.66.66,0,0,0-.66.66V5.49a.33.33,0,0,0,.33.33h.22a.33.33,0,0,0,.33-.33V2.94H4.68A.33.33,0,0,0,5,2.61V2.4A.33.33,0,0,0,4.68,2.07Z" fill="#fff" /><path d="M4.68,10.73H2.14V8.2a.33.33,0,0,0-.33-.33H1.6a.33.33,0,0,0-.33.33V11a.66.66,0,0,0,.66.67H4.68A.34.34,0,0,0,5,11.28v-.22A.33.33,0,0,0,4.68,10.73Z" fill="#fff" /><path d="M15.71,2.1H13a.33.33,0,0,0-.33.33v.21A.33.33,0,0,0,13,3h2.53V5.51a.33.33,0,0,0,.33.33h.23a.33.33,0,0,0,.33-.33V2.76A.66.66,0,0,0,15.71,2.1Z" fill="#fff" /><path d="M16.05,7.89h-.21a.33.33,0,0,0-.33.33v2.54H13a.33.33,0,0,0-.33.33v.22a.33.33,0,0,0,.33.33h2.75a.67.67,0,0,0,.67-.66V8.22A.33.33,0,0,0,16.05,7.89Z" fill="#fff" /></svg><text x="108" y="257.0" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">Sign every package</text><text x="108" y="280.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">Add a timestamp, so it</text><text x="108" y="295.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">outlasts the certificate</text><path d="M170,200 L170,226" fill="none" stroke="#4aa3f0" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="340" y="60" width="290" height="270" rx="12" fill="#161f2c" stroke="#2c3a4c" stroke-width="1.2"/><text x="356" y="84" font-size="12.5" font-weight="700" fill="#7dbbf3" text-anchor="start">2. Trust it, once</text><rect x="356" y="100" width="258" height="112" rx="8" fill="#1b2636" stroke="#33465c" stroke-width="1.2"/><svg x="370" y="117" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i3-aaede26b-698f-4a65-b6db-859d207e2da6" x1="8.05" y1="11.32" x2="8.05" y2="1.26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i3-bc54987f-34ba-4701-8ce4-6eca10aff9e9" x1="8.05" y1="15.21" x2="8.05" y2="11.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1490df" /><stop offset="0.98" stop-color="#1f56a3" /></linearGradient><linearGradient id="i3-a5434fd8-c18c-472c-be91-f2aa070858b7" x1="8.05" y1="7.87" x2="8.05" y2="4.94" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d2ebff" /><stop offset="1" stop-color="#f0fffd" /></linearGradient></defs><title>Icon-intune-329</title><rect x="0.5" y="1.26" width="15.1" height="10.06" rx="0.5" fill="url(#i3-aaede26b-698f-4a65-b6db-859d207e2da6)" /><rect x="1.34" y="2.1" width="13.42" height="8.39" rx="0.28" fill="#fff" /><path d="M11.08,14.37c-1.5-.23-1.56-1.31-1.55-3h-3c0,1.74-.06,2.82-1.55,3a.87.87,0,0,0-.74.84h7.54A.88.88,0,0,0,11.08,14.37Z" fill="url(#i3-bc54987f-34ba-4701-8ce4-6eca10aff9e9)" /><path d="M17.17,5.91H10.29a2.31,2.31,0,1,0,0,.92H11v9.58a.33.33,0,0,0,.33.33h5.83a.33.33,0,0,0,.33-.33V6.24A.33.33,0,0,0,17.17,5.91Z" fill="#32bedd" /><rect x="11.62" y="6.82" width="5.27" height="8.7" rx="0.12" fill="#fff" /><circle cx="8.05" cy="6.41" r="1.46" opacity="0.9" fill="url(#i3-a5434fd8-c18c-472c-be91-f2aa070858b7)" /><path d="M14.88,10.82,13.76,9.7a.06.06,0,0,0-.1.05v.68a.06.06,0,0,1-.06.06H11v.83H13.6a.06.06,0,0,1,.06.06v.69a.06.06,0,0,0,.1,0L14.88,11A.12.12,0,0,0,14.88,10.82Z" fill="#0078d4" /></svg><text x="416" y="131.0" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">Intune trusted</text><text x="416" y="149.225" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">certificate profile</text><text x="416" y="164.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">Pushes your root and</text><text x="416" y="179.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">intermediate certificates to</text><text x="416" y="194.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">devices</text><rect x="356" y="226" width="258" height="86" rx="8" fill="#152232" stroke="#314359" stroke-width="1.2"/><text x="370" y="257.0" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">Bought from a public CA?</text><text x="370" y="280.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">Windows already trusts it. Skip this</text><text x="370" y="295.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">step.</text><rect x="660" y="60" width="310" height="270" rx="12" fill="#161f2c" stroke="#2c3a4c" stroke-width="1.2"/><text x="676" y="84" font-size="12.5" font-weight="700" fill="#7dbbf3" text-anchor="start">3. Every device trusts every package</text><rect x="676" y="100" width="278" height="84" rx="8" fill="#1b2636" stroke="#33465c" stroke-width="1.2"/><svg x="690" y="117" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i4-b7b52328-afea-4ae3-a11b-e21cf942d33d" x