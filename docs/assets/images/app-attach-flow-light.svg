<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 25 1000 530" width="1000" height="530" font-family="'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">App Attach end to end</title><desc id="d">Existing App-V packages take a fast lane straight to the file share. Everything else is converted to MSIX, signed and turned into a CimFS disk image. The share feeds App Attach, which assigns the application to a host pool and a user group and attaches it when the user signs in.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f93bf"/></marker></defs><rect x="30" y="60" width="430" height="460" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="46" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">Step 1: Package, once per application</text><rect x="48" y="100" width="394" height="84" rx="8" fill="#f9fbfd" stroke="#d7e0ea" stroke-width="1.2"/><svg x="62" y="117" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i1-a7cb4d9d-9f89-4e53-8eda-938427310066" x1="8.8" y1="12.87" x2="8.8" y2="0.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i1-eab4c6b4-621d-4d9b-b611-15ceb58765b1" x1="8.81" y1="17.5" x2="8.81" y2="12.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1490df" /><stop offset="0.98" stop-color="#1f56a3" /></linearGradient></defs><title>Icon-compute-33</title><rect x="-0.2" y="0.87" width="18" height="12" rx="0.6" fill="url(#i1-a7cb4d9d-9f89-4e53-8eda-938427310066