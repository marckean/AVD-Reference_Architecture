op offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><title>Icon-compute-21</title><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#i5-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#i5-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></svg><text x="736" y="241.0" font-size="13.5" font-weight="700" fill="#e9eff6" text-anchor="start">Windows 365 Cloud PCs</text><text x="736" y="264.0" font-size="12" font-weight="400" fill="#aab8c7" text-anchor="start">Same profile, same packages</text><path d="M292,150 L356,150" fill="none" stroke="#4aa3f0" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M614,142 L676,142" fill="none" stroke="#4aa3f0" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M614,185 L645,185 L645,252 L676,252" fill="none" stroke="#4aa3f0" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="356" width="940" height="76" rx="8" fill="#152232" stroke="#314359" stroke-width="1.2"/><svg x="44" y="373" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i6-a7cb4d9d-9f89-4e53-8eda-938427310066" x1="8.8" y1="12.87" x2="8.8" y2="0.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i6-eab4c6b4-621d-4d9b-