<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 25 1000 440" width="1000" height="440" font-family="'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">One package, two platforms</title><desc id="d">A signed MSIX package is built once. Azure Virtual Desktop uses it as a CimFS image on Azure Files, attached by App Attach to pooled multi-session hosts. Windows 365 installs the same MSIX through Intune as a line-of-business app on single-session Cloud PCs. Windows 365 has no App Attach, so App-V packages need the built-in App-V client and a tool such as Configuration Manager, or a move to MSIX.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f93bf"/></marker></defs><rect x="30" y="60" width="250" height="370" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="46" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">Package once</text><rect x="46" y="180" width="218" height="110" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><svg x="60" y="197" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i1-a7cb4d9d-9f89-4e53-8eda-938427310066" x1="8.8" y1="12.87" x2="8.8" y2="0.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i1-eab4c6b4-621d-4d9b-b611-15ceb58765b1" x1="8.81" y1="17.5" x2="8.81" y2="12.87" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1490df" /><stop offset="0.98" stop-color="#1f56a3" /></linearGradient></defs><title>Icon-compute-33</title><rect