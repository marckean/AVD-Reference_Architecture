<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 25 1000 532" width="1000" height="532" font-family="'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Where App Attach problems show up</title><desc id="d">Four stages, with the two most common problems at each and the usual fix. Convert: exit code 259, and drivers or services. Sign: a publisher mismatch, 0x8007000B with Event ID 150, and an untrusted certificate, 0x800B0109. Store and mount: an image that won&#x27;t mount, and Microsoft Entra joined hosts that need Azure Files and two service principal roles. Register and run: an app that can&#x27;t write to its folder, and an update refused because the version number didn&#x27;t change. Test outside App Attach first to narrow it down.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker><marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f93bf"/></marker></defs><rect x="30" y="60" width="220" height="348" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="46" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">1. Convert</text><rect x="270" y="60" width="220" height="348" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="286" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">2. Sign</text><rect x="510" y="60" width="220" height="348" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="526" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">3. Store and mount</text><rect x="750" y="60" width="220" height="348" rx="12" fill="#f4f6f9" stroke="#d3dbe4" stroke-width="1.2"/><text x="766" y="84" font-size="12.5" font-weight="700" fill="#0f548c" text-anchor="start">4. Register and run</text><rect x="42" y="100" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="56" y="131.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Exit code 259</text><text x="56" y="154.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">The installer started</text><text x="56" y="169.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">another process and quit.</text><text x="56" y="184.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Use its silent or wait option</text><rect x="42" y="252" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="56" y="283.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Drivers and services</text><text x="56" y="306.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Drivers can&#x27;t go in MSIX.</text><text x="56" y="321.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Check the services report</text><text x="56" y="336.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">for services</text><rect x="282" y="100" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="296" y="131.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Publisher mismatch</text><text x="296" y="154.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">0x8007000B, Event ID 150:</text><text x="296" y="169.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">the manifest Publisher must</text><text x="296" y="184.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">match the certificate</text><text x="296" y="199.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">subject exactly</text><rect x="282" y="252" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="296" y="283.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Not trusted</text><text x="296" y="306.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">0x800B0109: trust the root</text><text x="296" y="321.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">and intermediate</text><text x="296" y="336.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">certificates on every host</text><rect x="522" y="100" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="536" y="131.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Image won&#x27;t mount</text><text x="536" y="154.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Mount it as SYSTEM with</text><text x="536" y="169.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">PsExec to test the share</text><text x="536" y="184.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">permissions</text><rect x="522" y="252" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="536" y="283.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Share access denied</text><text x="536" y="306.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Microsoft Entra joined</text><text x="536" y="321.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">hosts need Azure Files, plus</text><text x="536" y="336.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Reader and Data Access for</text><text x="536" y="351.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">both AVD service principals</text><rect x="762" y="100" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="776" y="131.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Can&#x27;t save settings</text><text x="776" y="154.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">It&#x27;s writing to its install</text><text x="776" y="169.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">folder. Add the PSF file</text><text x="776" y="184.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">redirection fixup in the</text><text x="776" y="199.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Package Editor</text><rect x="762" y="252" width="196" height="140" rx="8" fill="#ffffff" stroke="#cfd8e2" stroke-width="1.2"/><text x="776" y="283.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Update refused</text><text x="776" y="306.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Each new image needs a</text><text x="776" y="321.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">different version number</text><path d="M250,234 L270,234" fill="none" stroke="#0f6cbd" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M490,234 L510,234" fill="none" stroke="#0f6cbd" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M730,234 L750,234" fill="none" stroke="#0f6cbd" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="432" width="940" height="90" rx="8" fill="#f9fbfd" stroke="#d7e0ea" stroke-width="1.2"/><svg x="44" y="449" width="34" height="34" viewBox="0 0 18 18"><defs><linearGradient id="i1-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="i1-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><title>Icon-compute-21</title><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#i1-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#i1-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></svg><text x="90" y="463.0" font-size="13.5" font-weight="700" fill="#0b2a4a" text-anchor="start">Test outside App Attach first</text><text x="90" y="486.0" font-size="12" font-weight="400" fill="#3f4f60" text-anchor="start">Stage and register the package on a clean test machine. If it works there, look at the share or the assignment, not the package</text></svg>
